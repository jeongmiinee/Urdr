[package]
name = "urdr-native"
version = "4.4.0"
edition = "2024"
license = "Proprietary"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "default_fonts"] }
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
png = "0.18.1"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
single-instance = "0.3.3"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
